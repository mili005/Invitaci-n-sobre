<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Invitación</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
<section class="envelope" id="envelope" aria-label="Invitación interactiva">
<div class="envelope-shadow"></div>
<div class="envelope-back"></div>

<div class="video-card" id="videoCard">
<video id="invitationVideo" class="invitation-video" controls playsinline preload="metadata">
<source src="invitacion.mp4" type="video/mp4">
</video>
</div>

<div class="flap flap-left">
<div class="paper-texture"></div>
<div class="seal-piece seal-piece-left"></div>
</div>

<div class="flap flap-right">
<div class="paper-texture"></div>
<div class="seal-piece seal-piece-right"></div>
</div>

<div class="flap flap-bottom">
<div class="paper-texture"></div>
<div class="seal-piece seal-piece-bottom"></div>
</div>

<div class="flap flap-top">
<div class="paper-texture"></div>
<div class="seal-piece seal-piece-top"></div>
</div>

<button class="seal" id="sealButton" type="button" aria-label="Abrir invitación">
<span class="seal-shine"></span>
<span class="seal-crack seal-crack-one"></span>
<span class="seal-crack seal-crack-two"></span>
<span class="seal-crack seal-crack-three"></span>
<span class="seal-text">Tocar</span>
</button>

<div class="spark spark-one"></div>
<div class="spark spark-two"></div>
<div class="spark spark-three"></div>
<div class="spark spark-four"></div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script src="script.js"></script>
</body>
</html>
